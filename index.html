<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时来运转 · 动效主题包</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#2A0609; --bg2:#3C090E;
    --line:#E9B949; --line-bright:#FFDE8A; --line-deep:#9A7318;
    --accent:#8E1119; --accent-bright:#C4161F;
    --accent2:#1FA98A; --accent3:#C9971F;
    --cream:#FFF6E2; --glow:#FFD24A; --particle:#FFDE8A;
    --c1:#E8503A; --c2:#E9B949; --c3:#3FA98A; --c4:#6B8FE0; --c5:#C79BE0;
    --mx:0; --my:0; --shift-x:15vw;
    --serif:"Noto Serif SC","Songti SC",serif;
    --sans:"Inter","Noto Sans SC",system-ui,sans-serif;
    --mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--line)}
  body{font-family:var(--sans);cursor:crosshair;transition:background .6s ease}

  /* ── 背景点阵 ── */
  .bgdots{position:fixed;inset:-30%;z-index:0;pointer-events:none;
    background-image:radial-gradient(var(--line) 1px, transparent 1.4px);
    background-size:34px 34px;opacity:.10;animation:drift 90s linear infinite}
  @keyframes drift{to{background-position:680px 340px}}

  #outer{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none}
  #motes{position:fixed;inset:0;width:100vw;height:100vh;z-index:2;pointer-events:none}

  /* ── 舞台 ── */
  #stage{position:fixed;inset:0;z-index:3;display:grid;place-items:center;
    translate:calc(var(--shift-x) + var(--mx)*18px) calc(var(--my)*18px);
    transition:translate .5s cubic-bezier(.22,.61,.36,1), opacity .35s ease}
  body.swap #stage{opacity:0}
  .mandala{position:relative;width:min(88vmin,88vh);height:min(88vmin,88vh)}

  /* ── 壁纸模式：去掉文字、主体居中、四周留出安全边距 ── */
  body.wall{--shift-x:0vw}
  body.wall .mandala{width:min(76vmin,76vh);height:min(76vmin,76vh)}
  body.wall #copy,body.wall #hint,body.wall #themes,body.wall #spec,body.wall #loopbadge{
    display:none!important}
  /* 壁纸要干净：角落摆件与侧边大字在竖屏会挤到主体，收掉 */
  body.wall #motifs,body.wall #glyphs,body.wall #hang{display:none!important}
  .mandala svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .mandala g{transform-box:view-box;transform-origin:500px 500px}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinRev{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%{transform:scale(.9);opacity:.85}100%{transform:scale(1.55);opacity:0}}
  @keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}
  @keyframes flicker{0%,100%{opacity:.85}42%{opacity:.35}55%{opacity:.95}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.4vh) rotate(3deg)}}
  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes slidex{to{transform:translateX(-50%)}}
  @keyframes prayer{to{background-position-y:96px}}
  @keyframes burst{0%{transform:scale(.15);opacity:1}100%{transform:scale(3.4);opacity:0}}
  @keyframes flyout{
    0%{transform:translate(0,0) rotate(0) scale(.4);opacity:0}
    15%{opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--dr)) scale(1);opacity:0}}

  .spinf{animation:spin 150s linear infinite}
  .spinr{animation:spinRev 100s linear infinite}
  .breathe{transform-origin:500px 500px;transform-box:view-box;animation:breathe 6s ease-in-out infinite}
  .pulse-ring{transform-origin:500px 500px;transform-box:view-box;animation:pulse 5.2s cubic-bezier(.2,.6,.3,1) infinite}
  .flick{animation:flicker 3.4s ease-in-out infinite}

  /* ── 环绕图标 ── */
  #ring8{position:absolute;inset:0;animation:spin 100s linear infinite}
  .spoke{position:absolute;left:50%;top:50%;width:0;height:0;
    transform:rotate(var(--a)) translateY(calc(-1 * var(--r)))}
  .spoke .ic{position:absolute;left:0;top:0;width:5.2vmin;height:5.2vmin;
    transform:translate(-50%,-50%) rotate(calc(-1 * var(--a)));
    animation:spinRev 100s linear infinite}
  .spoke .ic svg{width:100%;height:100%;stroke-width:1.4;color:var(--line-bright);
    filter:drop-shadow(0 0 6px var(--glow))}

  /* ── 外围装饰 ── */
  #acc,#glyphs,#motifs,#hang,#bands{position:fixed;inset:0;pointer-events:none}
  #acc{z-index:4} #glyphs{z-index:5} #motifs{z-index:5} #hang{z-index:5} #bands{z-index:5}

  .seal{position:absolute;width:13vmin;height:13vmin;animation:bob 9s ease-in-out infinite;
    border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:color-mix(in srgb,var(--bg) 55%,transparent)}
  .seal svg{width:100%;height:100%;display:block}

  .band{position:absolute;left:-10%;right:-10%;height:2.8vmin;overflow:hidden}
  .band .row{display:flex;gap:1.3vmin;width:200%;animation:slidex 13s linear infinite}
  .band .row b{display:block;width:2.2vmin;height:2.2vmin;
    background:transparent;border:1px solid var(--glow);opacity:.5}
  .band.a2 .row{animation-duration:17s;animation-direction:reverse}
  .band.b-coin .row b:nth-child(4n){border-color:var(--accent-bright)}
  .band.b-coin .row b:nth-child(7n){border-color:var(--accent2)}
  .band.b-gear .row b{border-radius:50%;transform:rotate(45deg)}
  .band.b-star .row b{border-radius:50%;border-width:1px;transform:scale(.7)}
  .band.b-drop .row b{border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
  .band.b-bar .row b{width:3vmin;height:1.1vmin;border-radius:1px}

  .hang{position:absolute;top:-1vh;display:flex;flex-direction:column;align-items:center;gap:.5vh;
    transform-origin:top center;animation:sway 6.4s ease-in-out infinite;opacity:.85}
  .hang span{display:block}
  .hang.tassel span:nth-child(1){width:1px;height:11vh;background:var(--accent-bright);opacity:.7}
  .hang.tassel span:nth-child(2){width:2.4vmin;height:2.4vmin;border:1px solid var(--glow);transform:rotate(45deg)}
  .hang.tassel span:nth-child(3){width:2.2vmin;height:7vh;border:1px solid var(--accent-bright);opacity:.7}
  .hang.chain span{width:1.6vmin;height:1.6vmin;border:1px solid var(--line);border-radius:50%;opacity:.7}
  .hang.star span{width:.9vmin;height:.9vmin;border-radius:50%;background:var(--line-bright);opacity:.7}
  .hang.star span:nth-child(odd){width:1.7vmin;height:1.7vmin;opacity:.95}
  .hang.drop span{width:1.5vmin;height:2.1vmin;border:1px solid var(--accent-bright);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:.7}

  .ingot{position:absolute;animation:bob 6.4s ease-in-out infinite;color:var(--glow);opacity:.9}
  .ingot svg{width:100%;height:100%;opacity:.75}

  .chaich{position:absolute;font-family:var(--serif);font-weight:700;
    font-size:5.2vmin;line-height:1;color:var(--line-bright);opacity:.45;
    text-shadow:0 0 16px var(--glow), 0 0 3px var(--line-bright);
    animation:bob 7s ease-in-out infinite}

  /* ── 点击特效 ── */
  .burst{position:fixed;z-index:6;width:16vmin;height:16vmin;margin:-8vmin 0 0 -8vmin;
    border-radius:50%;border:2px solid var(--line-bright);pointer-events:none;
    animation:burst 1.5s cubic-bezier(.15,.7,.3,1) forwards}
  .flycoin{position:fixed;z-index:7;width:4.4vmin;height:4.4vmin;margin:-2.2vmin 0 0 -2.2vmin;
    pointer-events:none;color:var(--glow);animation:flyout 1.7s cubic-bezier(.1,.6,.3,1) forwards}
  .flycoin svg{width:100%;height:100%}

  /* ── 文字层 ── */
  #copy{position:fixed;left:0;top:0;bottom:0;width:37vw;z-index:8;pointer-events:none;
    transition:opacity .4s}
  #copy .eyebrow{position:absolute;left:4.2vw;top:9.2vh;
    font-family:var(--mono);font-size:max(13px,.82vw);font-weight:600;
    letter-spacing:.3em;text-transform:uppercase;color:var(--line);opacity:.9}
  #copy .eyebrow em{font-style:normal;opacity:.55;margin-left:.8em;letter-spacing:.2em}
  #copy .title{position:absolute;left:4.2vw;top:14.5vh;
    font-family:var(--serif);font-weight:700;color:var(--cream);
    font-size:min(11.5vw,19.5vh);line-height:.94;letter-spacing:.01em;
    text-shadow:0 2px 30px rgba(0,0,0,.45)}
  #copy .sub{position:absolute;left:4.2vw;right:3vw;top:53vh;
    font-family:var(--serif);font-weight:700;color:var(--line-bright);
    font-size:max(18px,1.42vw);line-height:1.45;letter-spacing:.02em;
    border-top:1px solid color-mix(in srgb,var(--line) 38%,transparent);padding-top:2vh}
  #copy .detail{position:absolute;left:4.2vw;right:3vw;top:63.5vh;
    list-style:none;display:flex;flex-direction:column;gap:1.4vh}
  #copy .detail li{font-size:max(15px,.9vw);line-height:1.62;
    color:color-mix(in srgb,var(--cream) 76%,transparent);padding-left:1.3em;position:relative}
  #copy .detail li::before{content:"";position:absolute;left:0;top:.72em;
    width:.65em;height:1px;background:var(--line);opacity:.9}
  #copy .detail li b{font-weight:700;color:var(--line-bright)}
  #copy .note{position:absolute;left:4.2vw;right:3vw;top:88vh;
    font-family:var(--mono);font-size:12px;letter-spacing:.18em;
    color:color-mix(in srgb,var(--line) 55%,transparent);
    border-top:1px solid color-mix(in srgb,var(--line) 22%,transparent);
    padding-top:1.6vh;line-height:1.6}

  /* ── 主题切换条 ── */
  /* 底部留出任务栏的高度（Windows 任务栏约 60px，占 3.8vh），
     否则第二行主题会被任务栏挡住点不到 */
  #themes{position:fixed;left:50%;transform:translateX(-50%);z-index:10;
    bottom:max(7vh, 92px);
    display:flex;flex-direction:column;align-items:center;gap:5px;max-width:95vw;
    transition:opacity .4s}
  #themes .catrow,#themes .themerow{display:flex;flex-wrap:wrap;justify-content:center;
    gap:4px;max-width:95vw}
  #themes button{font-family:var(--mono);letter-spacing:.1em;
    cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;
    color:color-mix(in srgb,var(--line) 70%,transparent);
    background:color-mix(in srgb,var(--bg) 70%,transparent);
    border:1px solid color-mix(in srgb,var(--line) 28%,transparent);
    transition:all .25s}
  #themes .catrow button{font-size:10px;padding:3px 8px;opacity:.7}
  #themes .catrow button.on{opacity:1;color:var(--line-bright);
    background:color-mix(in srgb,var(--line) 16%,transparent);
    border-color:color-mix(in srgb,var(--line) 62%,transparent)}
  #themes .themerow button{font-size:11px;padding:6px 11px}
  #themes button i{font-style:normal;opacity:.5;font-size:10px}
  #themes button:hover{border-color:color-mix(in srgb,var(--line) 60%,transparent);color:var(--line-bright)}
  #themes button.on{color:var(--bg);background:var(--line);border-color:var(--line)}
  #themes button.on i{opacity:.7}

  /* ── 说明面板 ── */
  #spec{position:fixed;right:2vh;top:2vh;z-index:10;width:33ch;
    font-family:var(--mono);font-size:11px;line-height:1.85;letter-spacing:.05em;
    color:color-mix(in srgb,var(--line) 78%,transparent);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    border:1px solid color-mix(in srgb,var(--line) 25%,transparent);
    padding:14px 16px;opacity:0;pointer-events:none;transition:opacity .3s}
  #spec.on{opacity:1}
  #spec h4{font-weight:600;color:var(--line-bright);letter-spacing:.2em;font-size:11px;margin-bottom:2px}
  #spec .hr{height:1px;background:color-mix(in srgb,var(--line) 22%,transparent);margin:8px 0}
  #spec .r{display:flex;justify-content:space-between;gap:10px}
  #spec .r span:last-child{opacity:.75;text-align:right}
  #spec .sw{display:flex;gap:4px;margin-top:8px}
  #spec .sw i{width:16px;height:16px;display:block;border:1px solid color-mix(in srgb,var(--line) 30%,transparent)}

  /* ── 提示 ── */
  #hint{position:fixed;right:2vh;bottom:2vh;z-index:9;font-family:var(--mono);font-size:12px;
    letter-spacing:.12em;color:color-mix(in srgb,var(--line) 60%,transparent);
    text-align:right;line-height:1.9;transition:opacity .4s}
  #hint b{border:1px solid color-mix(in srgb,var(--line) 35%,transparent);
    padding:1px 6px;margin-right:6px;color:var(--line)}

  body.hide-ui #copy,body.hide-ui #hint,body.hide-ui #themes,body.hide-ui #spec{opacity:0;pointer-events:none}
  body.paused *{animation-play-state:paused!important}
  #spec.on + #hint{bottom:auto;top:2vh;right:calc(2vh + 33ch + 20px)}
</style>
</head>
<body>
  <div class="bgdots"></div>
  <canvas id="outer"></canvas>
  <canvas id="motes"></canvas>

  <div id="bands"></div>
  <div id="hang"></div>
  <div id="motifs"></div>
  <div id="glyphs"></div>
  <div id="acc"></div>

  <div id="stage">
    <div class="mandala">
      <svg id="m" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
      <div id="ring8"></div>
    </div>
  </div>

  <div id="copy">
    <div class="eyebrow" id="cEyebrow"></div>
    <h1 class="title" id="cTitle"></h1>
    <div class="sub" id="cSub"></div>
    <ul class="detail" id="cPoints"></ul>
    <div class="note" id="cNote"></div>
  </div>

  <div id="themes"></div>
  <div id="spec"></div>
  <div id="hint">
    <div><b>点击</b>爆环</div>
    <div><b>1-9</b>选本类主题</div>
    <div><b>[ ]</b>上下切换</div>
    <div><b>P</b>换配色</div>
    <div><b>B</b>暂停</div>
    <div><b>I</b>主题包说明</div>
  </div>

<script>
/* ══════════════════════════════════════════════════════════════
   时来运转 · 动效主题包
   ──────────────────────────────────────────────────────────────
   引擎（四个主题共用，这是"相似性"所在）：
     · 多层同心结构
     · 各层异速、方向交替旋转（由外向内递增）
     · 核心呼吸 + 脉冲环扩散
     · 粒子层 + 外围 canvas
     · 视差 / 点击爆环 / 配色切换 / 暂停
   主题（完全可以替换的部分）：
     · 形状词汇（shape）、图标（icons）、配色（palette）、文案（copy）、外围装饰（deco）
   ══════════════════════════════════════════════════════════════ */

/* ─────────── 几何工具 ─────────── */
const NS = 'http://www.w3.org/2000/svg';
const CX = 500, CY = 500;
const el = (t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
const pol = (r,d)=>{ const a=(d-90)*Math.PI/180; return [CX+r*Math.cos(a), CY+r*Math.sin(a)]; };
const pt = p => p[0].toFixed(2)+' '+p[1].toFixed(2);
const pathOf = pts => pts.map((p,i)=>(i?'L':'M')+pt(p)).join(' ');

/* 花瓣（曼陀罗 / 水生主题共用） */
function petalPath(r1,r2,w){
  const a=-(r1+(r2-r1)*.28), b=-(r1+(r2-r1)*.78);
  return `M ${CX} ${CY-r1} C ${CX+w} ${CY+a}, ${CX+w} ${CY+b}, ${CX} ${CY-r2} `+
         `C ${CX-w} ${CY+b}, ${CX-w} ${CY+a}, ${CX} ${CY-r1} Z`;
}
/* 齿轮（梯形齿） */
function gearPath(teeth,rRoot,rTip,tw){
  let d='';
  for(let i=0;i<teeth;i++){
    const a=i*360/teeth, h=tw/2;
    const p1=pol(rRoot,a-h*1.6), p2=pol(rTip,a-h*.85), p3=pol(rTip,a+h*.85), p4=pol(rRoot,a+h*1.6);
    d += (i?' L ':'M ')+pt(p1)+' L '+pt(p2)+' L '+pt(p3)+' L '+pt(p4);
  }
  return d+' Z';
}
/* 多角星 */
function starPath(points,rOut,rIn,phase){
  const P=[];
  for(let i=0;i<points*2;i++){
    P.push(pol(i%2?rIn:rOut, (i/(points*2))*360 + (phase||0)));
  }
  return pathOf(P)+' Z';
}
/* 波状圆 */
function wavePath(r,amp,waves,phase){
  const N=260, P=[];
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const rr=r+amp*Math.sin(a*waves+(phase||0));
    P.push([CX+Math.cos(a)*rr, CY+Math.sin(a)*rr]);
  }
  return pathOf(P)+' Z';
}
/* 螺线 */
function spiralPath(r0,r1,turns,phase){
  const N=320, P=[];
  for(let i=0;i<=N;i++){
    const u=i/N, a=u*turns*Math.PI*2+(phase||0);
    const r=r0+(r1-r0)*u;
    P.push([CX+Math.cos(a)*r, CY+Math.sin(a)*r]);
  }
  return pathOf(P);
}
/* 水滴（尖端朝上，原点居中） */
function dropPath(r,w){
  return `M 0 ${-r*1.7} C ${w*.95} ${-r*.5}, ${w} ${r*.55}, 0 ${r} `+
         `C ${-w} ${r*.55}, ${-w*.95} ${-r*.5}, 0 ${-r*1.7} Z`;
}
/* 把一个元素按角度摆在环上 */
function place(g, angle, node){ node.setAttribute('transform',`rotate(${angle} ${CX} ${CY})`); g.appendChild(node); return node; }
/* 圆弧段（四季弧等） */
function arcPath(r, startDeg, spanDeg){
  const a=pol(r,startDeg), b=pol(r,startDeg+spanDeg);
  return `M ${pt(a)} A ${r} ${r} 0 ${spanDeg>180?1:0} 1 ${pt(b)}`;
}
/* 月相：返回被照亮部分的轮廓（phase 0=朔 0.25=上弦 0.5=望 0.75=下弦） */
function moonPath(r, phase, cx, cy){
  const rx = r*Math.cos(2*Math.PI*phase);
  const sw = rx >= 0 ? 0 : 1;
  return `M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} `+
         `A ${Math.abs(rx).toFixed(2)} ${r} 0 0 ${sw} ${cx} ${cy-r} Z`;
}
/* 太极（阴阳鱼）：填一半，另一半留白 */
function taijiPath(r, cx, cy){
  const h = r/2;
  return `M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} `+
         `A ${h} ${h} 0 0 1 ${cx} ${cy} A ${h} ${h} 0 0 0 ${cx} ${cy-r} Z`;
}
/* 卦象：把 n 爻合成一条路径（1=阳爻实线，0=阴爻中断） */
function guaPath(cx, topY, w, lh, gap, pattern){
  let d='';
  pattern.forEach((solid,j)=>{
    const y = topY + j*(lh+gap);
    if(solid) d += `M ${cx-w/2} ${y} H ${cx+w/2} `;
    else d += `M ${cx-w/2} ${y} H ${cx-w*.16} M ${cx+w*.16} ${y} H ${cx+w/2} `;
  });
  return d;
}
/* 回纹（雷纹） */
function meanderPath(cx, cy, w, h){
  const s = h/2;
  return `M ${cx-w/2} ${cy+h/2} H ${cx+w/2} V ${cy-h/2} `+
         `H ${cx-w/2+s} V ${cy+h/2-s} H ${cx+w/2-s}`;
}
/* 如意云头 */
function cloudPath(cx, cy, w, h){
  const q = w/6;
  return `M ${cx-w/2} ${cy+h} `+
         `Q ${cx-w/2} ${cy-h}, ${cx-w/2+q*1.2} ${cy-h} `+
         `Q ${cx-q*.2} ${cy-h*2.3}, ${cx+q*1.2} ${cy-h} `+
         `Q ${cx+w/2} ${cy-h}, ${cx+w/2} ${cy+h}`;
}
/* 五色循环（用于五福临门） */
const C5 = i => 'var(--c'+(i%5+1)+')';
/* 叶序点阵：黄金角 137.5°，植物长叶子的排法（生生不息用） */
function phyllo(n, c, rot){
  const G=137.50776, out=[];
  for(let i=1;i<=n;i++) out.push({r:c*Math.sqrt(i), a:i*G+(rot||0)});
  return out;
}
/* 蝶翅（右翅，从身体原点展开） */
function wingPath(s){
  return `M 0 0 C ${s*.95} ${-s*.95}, ${s*1.3} ${s*.12}, ${s*.52} ${s*.82} `+
         `C ${s*.26} ${s*.92}, ${s*.1} ${s*.5}, 0 0 Z`;
}

/* 局部坐标齿轮（用于中环小齿轮） */
function gearPathLocal(cx,cy,teeth,rRoot,rTip,tw){
  let d='';
  for(let i=0;i<teeth;i++){
    const a=i*360/teeth, h=tw/2;
    const P=(r,deg)=>{ const rad=(deg-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; };
    const p1=P(rRoot,a-h*1.6), p2=P(rTip,a-h*.85), p3=P(rTip,a+h*.85), p4=P(rRoot,a+h*1.6);
    d += (i?' L ':'M ')+pt(p1)+' L '+pt(p2)+' L '+pt(p3)+' L '+pt(p4);
  }
  return d+' Z';
}

    core.appendChild(el('path',{d:`M ${CX-16} ${CY} Q ${CX} ${CY+22}, ${CX+16} ${CY}`,fill:'none',stroke:'var(--accent2)','stroke-width':1.6,opacity:.6}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:5,fill:'var(--line-bright)',opacity:.95}));
  }else if(t.core.knot2){
    /* 喜结良缘：盘长结 */
    core.appendChild(el('circle',{cx:CX,cy:CY,r:58,fill:'none',stroke:'var(--line)','stroke-width':1.2,opacity:.5}));
    core.appendChild(el('rect',{x:CX-30,y:CY-30,width:60,height:60,rx:10,fill:'none',stroke:'var(--line-bright)','stroke-width':2.2,opacity:.95}));
    core.appendChild(el('rect',{x:CX-16,y:CY-16,width:32,height:32,rx:6,fill:'none',stroke:'var(--accent2)','stroke-width':1.8,opacity:.9}));
    core.appendChild(el('path',{d:`M ${CX-30} ${CY} H ${CX+30} M ${CX} ${CY-30} V ${CY+30}`,fill:'none',stroke:'var(--line)','stroke-width':1.5,opacity:.8}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:5,fill:'var(--line-bright)',opacity:.95}));
  }else if(t.core.tworing){
    /* 白头偕老：两环交叠 */
    core.appendChild(el('circle',{cx:CX,cy:CY,r:58,fill:'none',stroke:'var(--line)','stroke-width':1,opacity:.4}));
    core.appendChild(el('circle',{cx:CX-17,cy:CY,r:30,fill:'none',stroke:'var(--line-bright)','stroke-width':1.8,opacity:.9}));
    core.appendChild(el('circle',{cx:CX+17,cy:CY,r:30,fill:'none',stroke:'var(--accent2)','stroke-width':1.8,opacity:.9}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:5,fill:'var(--line-bright)',opacity:.95}));
  }else if(t.core.quad){
    /* 四季平安：四色四分 */
    ['var(--c1)','var(--c2)','var(--c3)','var(--c4)'].forEach((c,i)=>{
      core.appendChild(el('path',{d:arcPath(50,i*90-90,88),fill:'none',stroke:c,'stroke-width':9,opacity:.9,'stroke-linecap':'butt'}));
    });
    core.appendChild(el('circle',{cx:CX,cy:CY,r:20,fill:'none',stroke:'var(--line-bright)','stroke-width':1.4,opacity:.7}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:7,fill:'var(--line-bright)',opacity:.95}));
  }else if(t.core.shou){
    /* 福寿康宁：圆寿 */
    core.appendChild(el('circle',{cx:CX,cy:CY,r:58,fill:'none',stroke:'var(--line-bright)','stroke-width':1.8,opacity:.9}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:46,fill:'none',stroke:'var(--line)','stroke-width':1,opacity:.55}));
    for(let i=0;i<3;i++) core.appendChild(el('line',{x1:CX-24,y1:CY-18+i*9,x2:CX+24,y2:CY-18+i*9,stroke:'var(--line-bright)','stroke-width':2,opacity:.9}));
    core.appendChild(el('rect',{x:CX-13,y:CY+6,width:26,height:18,fill:'none',stroke:'var(--line-bright)','stroke-width':1.6,opacity:.9}));
    core.appendChild(el('line',{x1:CX,y1:CY-30,x2:CX,y2:CY-18,stroke:'var(--line-bright)','stroke-width':2,opacity:.9}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:4,fill:'var(--accent2)',opacity:.9}));
  }else if(t.core.family){
    /* 阖家团圆：同心围坐 + 一盏灯 */
    for(let i=0;i<4;i++) core.appendChild(el('circle',{cx:CX,cy:CY,r:20+i*12,fill:'none',stroke:'var(--line)','stroke-width':1.2,opacity:.7-i*.1}));
    for(let i=0;i<8;i++){
      const a=i*45*Math.PI/180;
      core.appendChild(el('circle',{cx:CX+Math.cos(a)*44,cy:CY+Math.sin(a)*44,r:4.2,fill:'var(--line-bright)',opacity:.9}));
    }
    core.appendChild(el('circle',{cx:CX,cy:CY,r:11,fill:'var(--glow)','fill-opacity':.55,stroke:'var(--line-bright)','stroke-width':1.4,opacity:.95}));
  }else if(t.core.balance){
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[0],fill:'none',stroke:'var(--line-bright)','stroke-width':2,opacity:.9}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[1],fill:'none',stroke:'var(--line)','stroke-width':1.4,opacity:.7}));
    for(let i=0;i<4;i++) core.appendChild(el('rect',{x:CX-1.6,y:CY-R[1],width:3.2,height:R[1]-R[2],fill:'var(--line-bright)',opacity:.8,transform:`rotate(${i*45} ${CX} ${CY})`}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[2],fill:'var(--accent-bright)',opacity:.28}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[3],fill:'var(--line-bright)',opacity:.95}));
  }else if(t.core.duo){
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[0],fill:'none',stroke:'var(--line-bright)','stroke-width':2,opacity:.9}));
    core.appendChild(el('circle',{cx:CX-14,cy:CY,r:R[1],fill:'var(--accent2)','fill-opacity':.30,stroke:'var(--accent2)','stroke-width':1.4,opacity:.95}));
    core.appendChild(el('circle',{cx:CX+16,cy:CY+6,r:R[2],fill:'var(--line-bright)','fill-opacity':.22,stroke:'var(--line-bright)','stroke-width':1.3,opacity:.9}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[3],fill:'var(--line-bright)',opacity:.95}));
  }else{
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[0],fill:'none',stroke:'var(--line-bright)','stroke-width':2.2,opacity:.95}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[1],fill:'var(--accent-bright)',opacity:.32}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[2],fill:'none',stroke:'var(--line-bright)','stroke-width':1.7,opacity:.95}));
    core.appendChild(el('circle',{cx:CX,cy:CY,r:R[3],fill:'var(--line-bright)',opacity:.9}));
  }
  svgEl.appendChild(core);

  /* 脉冲环 */
  for(let i=0;i<4;i++){
    const c=el('circle',{cx:CX,cy:CY,r:(t.core.r||54)+8,fill:'none',stroke:'var(--line-bright)','stroke-width':1.8,class:'pulse-ring'});
    c.style.animationDelay=(i*1.3)+'s';
    svgEl.appendChild(c);
  }

  /* 主题自带的额外层（如星盘行星） */
  if(t.build) t.build(svgEl);
}

/* 2) 环绕图标 */
function buildIcons(t){
  const box=$('#ring8'); box.innerHTML='';
  box.style.animationDuration='110s';
  const haveLucide = typeof window.lucide!=='undefined' && window.lucide.createIcons;
  t.icons.forEach((name,i)=>{
    const sp=document.createElement('div');
    sp.className='spoke';
    sp.style.setProperty('--a',(i*360/t.icons.length)+'deg');
    sp.style.setProperty('--r','23vmin');
    const ic=document.createElement('div');
    ic.className='ic';
    ic.style.animationDuration='110s';
    if(haveLucide){ ic.innerHTML='<i data-lucide="'+name+'"></i>'; }
    else{
      ic.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">'+
        '<circle cx="12" cy="12" r="7"/><path d="M12 5v14M5 12h14"/></svg>';
    }
    sp.appendChild(ic);
    box.appendChild(sp);
  });
  if(haveLucide){ try{ window.lucide.createIcons(); }catch(e){} }
}

      '<path d="M40 60 Q60 78 80 60" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".55"/></svg>';
  if(kind==='knot')             /* 盘长结 */
    return '<svg viewBox="0 0 120 120">'+
      '<rect x="26" y="26" width="68" height="68" rx="10" fill="none" stroke="currentColor" stroke-width="3"/>'+
      '<rect x="43" y="43" width="34" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2.6"/>'+

  if(kind==='quad'){            /* 四季四分 */

    let dq='';
    for(let i=0;i<4;i++){

  if(kind==='ring')             /* 多重同心环 */
    return '<svg viewBox="0 0 120 120">'+
      '<circle cx="60" cy="60" r="44" fill="none" stroke="currentColor" stroke-width="3"/>'+
      '<circle cx="60" cy="60" r="30" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".8"/>'+
      '<circle cx="60" cy="60" r="16" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".8"/>'+
      '<circle cx="60" cy="60" r="5" fill="currentColor"/></svg>';
  if(kind==='ingot')
    return '<svg viewBox="0 0 120 100">'+
      '<path d="M10 58 C 10 86, 110 86, 110 58 L 88 40 L 32 40 Z" fill="none" stroke="currentColor" stroke-width="3"/>'+
      '<ellipse cx="60" cy="38" rx="28" ry="15" fill="none" stroke="currentColor" stroke-width="3"/>'+
      '<path d="M28 62 C 44 74, 76 74, 92 62" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';
  if(kind==='gear'){
    let d='';
    for(let i=0;i<10;i++) d+='<rect x="56" y="14" width="8" height="14" fill="currentColor" transform="rotate('+(i*36)+' 60 60)"/>';

      '<path d="M60 82 C72 78 78 68 80 56 C68 59 62 70 60 82 Z" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>';
  return '<svg viewBox="0 0 120 120">'+

    '<path d="M20 96 Q 60 108 100 96" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';

function cornerSVG(kind,idx){
  const o=[]; const A=(t,a)=>{ let s='<'+t; for(const k in a) s+=' '+k+'="'+a[k]+'"'; return s+'/>'; };
  o.push(A('rect',{x:6,y:6,width:88,height:88,fill:'none',stroke:'var(--line)','stroke-width':1.2,opacity:.7}));
  o.push(A('rect',{x:12,y:12,width:76,height:76,fill:'none',stroke:'var(--line-bright)','stroke-width':.7,opacity:.45}));
  if(kind==='seal'){
    const seeds=[[3,1,4,1,5,9,2,6],[2,7,1,8,2,8,1,8],[1,6,1,8,3,3,9,9],[5,9,2,6,5,3,5,8]][idx%4];
    let x=50,y=22,d='M 50 22';
    for(let i=0;i<seeds.length;i++){
      const step=7+seeds[i];
      if(i%2===0){ x=50+((i%4<2)?step:-step); d+=' L '+x+' '+y; }
      else { y+=step*.9; d+=' L '+x+' '+y; }
      if(y>80) y=80;
    }
    o.push(A('path',{d:d,fill:'none',stroke:'var(--line-bright)','stroke-width':1.5,opacity:.95}));
    o.push(A('circle',{cx:50,cy:50,r:3,fill:'var(--line-bright)',opacity:.9}));
  }else if(kind==='rivet'){
    o.push(A('circle',{cx:50,cy:50,r:22,fill:'none',stroke:'var(--line-bright)','stroke-width':1.4,opacity:.9}));
    [[26,26],[74,26],[26,74],[74,74]].forEach(p=>o.push(A('circle',{cx:p[0],cy:p[1],r:4.2,fill:'var(--line-bright)',opacity:.85})));
    o.push(A('path',{d:'M28 50 H72 M50 28 V72',fill:'none',stroke:'var(--line)','stroke-width':1.1,opacity:.7}));
    o.push(A('circle',{cx:50,cy:50,r:6.5,fill:'var(--line)',opacity:.9}));
  }else if(kind==='chart'){
    o.push(A('circle',{cx:50,cy:50,r:30,fill:'none',stroke:'var(--line)','stroke-width':1,opacity:.55}));
    o.push(A('path',{d:'M50 50 L74 34 M50 50 L28 38 M50 50 L58 74',fill:'none',stroke:'var(--line)','stroke-width':1,opacity:.5}));
    [[70,34],[28,38],[58,74],[38,62],[66,60]].forEach(p=>o.push(A('circle',{cx:p[0],cy:p[1],r:2.6,fill:'var(--line-bright)',opacity:.9})));
    o.push(A('circle',{cx:50,cy:50,r:3.4,fill:'var(--line-bright)',opacity:.95}));
  }else if(kind==='trigram'){
    [1,0,1].forEach((solid,i)=>{
      const y=32+i*18;
      if(solid) o.push(A('rect',{x:22,y:y,width:56,height:7,fill:'var(--line-bright)',opacity:.9}));
      else{
        o.push(A('rect',{x:22,y:y,width:22,height:7,fill:'var(--line-bright)',opacity:.9}));
        o.push(A('rect',{x:56,y:y,width:22,height:7,fill:'var(--line-bright)',opacity:.9}));
      }
    });
    o.push(A('circle',{cx:50,cy:78,r:2.6,fill:'var(--accent-bright)',opacity:.9}));
  }else if(kind==='moon'){
    o.push(A('circle',{cx:50,cy:50,r:32,fill:'none',stroke:'var(--line)','stroke-width':1.2,opacity:.7}));
    o.push(A('path',{d:'M50 18 A32 32 0 0 1 50 82 A19 32 0 0 0 50 18 Z',fill:'var(--line-bright)','fill-opacity':.22,stroke:'var(--line-bright)','stroke-width':1.4,opacity:.95}));
    o.push(A('circle',{cx:62,cy:40,r:3.4,fill:'none',stroke:'var(--line)','stroke-width':1,opacity:.6}));
    o.push(A('circle',{cx:50,cy:72,r:3,fill:'var(--accent2)',opacity:.8}));
  }else if(kind==='ring'){
    for(let i=0;i<5;i++) o.push(A('circle',{cx:50,cy:50,r:12+i*7,fill:'none',stroke:'var(--line)','stroke-width':1.1,opacity:(.75-i*.08).toFixed(2)}));
    o.push(A('circle',{cx:50,cy:50,r:3.5,fill:'var(--line-bright)',opacity:.9}));
  }else{
    o.push(A('path',{d:'M50 20 C 62 42, 68 52, 68 60 A 18 18 0 1 1 32 60 C 32 52, 38 42, 50 20 Z',fill:'none',stroke:'var(--line-bright)','stroke-width':1.5,opacity:.9}));
    o.push(A('path',{d:'M22 74 Q 50 84 78 74',fill:'none',stroke:'var(--line)','stroke-width':1.1,opacity:.7}));
    o.push(A('path',{d:'M28 82 Q 50 90 72 82',fill:'none',stroke:'var(--line)','stroke-width':1,opacity:.45}));
  }
  return '<svg viewBox="0 0 100 100">'+o.join('')+'</svg>';
}
function buildDeco(t){
  const d=t.deco;
  /* 上下珠带 */
  ['abadTop','abadBot'].forEach((id,i)=>{
    const box=document.createElement('div');
    box.id=id; box.className='band b-'+d.band+(i?' a2':'');
    box.style.cssText = i? 'bottom:3.2vh':'top:3.2vh';
    box.innerHTML='<div class="row">'+new Array(70).fill('<b></b>').join('')+'</div>';
    $('#bands').appendChild(box);
  });
  /* 吊挂 */
  d.hangAt.forEach((x,i)=>{
    const h=document.createElement('div');
    h.className='hang '+d.hang;
    h.style.cssText='left:'+x+'vw;animation-delay:'+(i*.7)+'s';
    const n = d.hang==='chain'?9 : d.hang==='star'?7 : 3;
    h.innerHTML=new Array(n).fill('<span></span>').join('');
    $('#hang').appendChild(h);
  });
  /* 四角元宝 / 齿轮 / 星 / 水滴 */
  d.motifAt.forEach((p,i)=>{
    const m=document.createElement('div');
    m.className='ingot';
    m.style.cssText='left:'+p[0]+'vw;top:'+p[1]+'vh;width:'+(8.5+(i%3)*1.4)+'vmin;height:'+(7+(i%3)*1.2)+'vmin;animation-delay:'+(i*.8)+'s';
    m.innerHTML=motifSVG(d.motif);
    $('#motifs').appendChild(m);
  });
  /* 侧边大字 */
  [[96.4,24],[96.4,60]].forEach((p,i)=>{
    const c=document.createElement('div');
    c.className='chaich'; c.textContent=d.glyph;
    c.style.cssText='left:'+p[0]+'vw;top:'+p[1]+'vh;animation-delay:'+(i*1.1)+'s';
    $('#glyphs').appendChild(c);
  });
  /* 角标 */
  [[1,'s2'],[2,'s3']].forEach(([idx])=>{
    const s=document.createElement('div');
    s.className='seal';
    s.style.cssText = idx===1 ? 'right:4vmin;top:4vmin;animation-delay:1.6s'
                              : 'right:4vmin;bottom:4vmin;animation-delay:3.2s';
    s.innerHTML=cornerSVG(d.corner, idx);
    $('#acc').appendChild(s);
  });
}

/* 5) 主题包说明面板 */
function buildSpec(t){
  const p=t.palette;
  const rows=t.layers.map(L=>
    '<div class="r"><span>'+L.n+'</span><span>'+L.shape+'</span></div>'+
    '<div class="r"><span></span><span>'+(L.d>0?'顺时针':'逆时针')+' · '+L.p+'s</span></div>'
  ).join('');
  $('#spec').innerHTML =
    '<h4>'+t.name+' · 主题包</h4>'+
    '<div style="opacity:.6">'+t.en+'</div>'+
    '<div class="hr"></div>'+

/* 6) 总渲染（带序号防并发错序） */
let renderSeq = 0;
function render(key){
  const t=THEMES[key]; if(!t) return;

/* ─────────── 外围 canvas ─────────── */
const outer=$('#outer'), og=outer.getContext('2d');
const R=(a,b)=>a+Math.random()*(b-a);
let oW,oH,oCX,oCY,SAFE;
let oRing=[],oFall=[],oRise=[],oNet=[],oInflow=[],oTop=[];
let oNetBreath=0, oPulseRate=0, oStreakRate=0;

/* ══════════════════════════════════════════════════════════════
   无缝循环
   ──────────────────────────────────────────────────────────────
   把 LOOP_T 秒定为一个循环。所有会动的东西——CSS 动画周期、
   画布粒子速度、闪烁频率——都被吸附到「每 T 秒恰好发生整数次」，
   于是 t=0 与 t=T 的画面完全相同，可以直接首尾相接循环。
   在 URL 后加 ?loop=60 开启（秒数可改），或设 window.__LOOP_T。
   ══════════════════════════════════════════════════════════════ */
let LOOP_T = 0;
(function(){
  const m = /[?&]loop=([0-9.]+)/.exec(location.search || '');
  if (m) LOOP_T = parseFloat(m[1]);
  if (window.__LOOP_T) LOOP_T = parseFloat(window.__LOOP_T);
  if (!isFinite(LOOP_T) || LOOP_T <= 0) LOOP_T = 0;
})();

/* 壁纸模式：主体居中、去掉文字与摆件，用于手机锁屏 / 桌面壁纸 */
let WALL = false;
(function(){
  WALL = /[?&]wall=1/.test(location.search || '');
  if (WALL && document.body) document.body.classList.add('wall');
})();

/* 每秒发生 n 次 → 让整个循环恰好发生整数次 */
function ratePerSec(perSec, T){
  if (!T) return perSec;
  const k = Math.max(1, Math.round(Math.abs(perSec) * T));
  return k / T;
}
/* 周期 → 吸附到 T 的整数分之一 */
function snapPeriod(period, T){
  if (!T || !period || !isFinite(period)) return period;
  let bestK = 1, best = Infinity;
  for (let k = 1; k <= 240; k++){
    const e = Math.abs(T / k - period);
    if (e < best){ best = e; bestK = k; }
  }
  return T / bestK;
}
/* 把所有 CSS 动画的时长吸附到 T 的整数分之一 */
function applyLoopToAnimations(){
  if (!LOOP_T) return;
  let n = 0;
  for (const a of document.getAnimations()){
    try{
      const tm = a.effect && a.effect.getTiming ? a.effect.getTiming() : null;
      const d = tm ? tm.duration : null;
      if (typeof d === 'number' && isFinite(d) && d > 0){
        const nd = snapPeriod(d / 1000, LOOP_T) * 1000;
        if (Math.abs(nd - d) > 0.5){ a.effect.updateTiming({ duration: nd }); n++; }
      }
    }catch(e){}
  }
  /* 星盘的行星轨道同样要对齐 */
  const pl = (window.__THEMES && __THEMES.astrolabe && __THEMES.astrolabe._planets) || null;
  if (pl) for (const p of pl){
    const cyc = Math.max(1, Math.round(p.sp * LOOP_T * 1000 / 6.2832));
    p.sp = 6.2832 * cyc / (LOOP_T * 1000);
  }
  return n;
}
const frac = v => v - Math.floor(v);

function outsidePoint(pad){
  for(let k=0;k<90;k++){
    const x=R(0,oW), y=R(0,oH);
    if(!WALL && x<oW*0.37) continue;
    if(Math.hypot(x-oCX,y-oCY) > SAFE+pad) return {x:x,y:y};
  }
  return {x:oW*0.9, y:R(.08,.92)*oH};
}

function layoutOuter(){
  oW=outer.width=innerWidth; oH=outer.height=innerHeight;
  oCX=oW*(WALL?0.5:0.65); oCY=oH/2; SAFE=Math.min(oW,oH)*(WALL?0.42:0.45);
  const cfg=(CUR&&CUR.outer)||{ringCount:26,drift:24};
  const T=LOOP_T;

  /* ① 外圈标记环 */
  oRing=[];
  for(let i=0;i<cfg.ringCount;i++){
    const sp=R(.00010,.00020)*(i%2?1:-1);       /* 原为每帧弧度，换算成圈/秒 */
    const vr=R(-1.4,1.4);
    oRing.push({
      a0:i*6.283/cfg.ringCount,
      rateA: ratePerSec(Math.abs(sp)*152.8, T) * Math.sign(sp),
      rot0:R(0,6.28),
      rateR: ratePerSec(Math.abs(vr)*.1592, T) * Math.sign(vr),
      s:R(4,6.8)
    });
  }

  /* ② 双向流 */
  oFall=[]; oRise=[];
  for(let i=0;i<cfg.drift;i++){
    const p=outsidePoint(16);
    oFall.push({x:p.x, ph0:R(0,1), s:R(5,11),
      rate: ratePerSec(R(42,110)/(oH+48), T),
      rot0:R(0,6.28), rateR: ratePerSec(R(0,1.8)*.1592, T) * (Math.random()<.5?-1:1)});
  }
  for(let i=0;i<cfg.drift;i++){
    const p=outsidePoint(16);
    oRise.push({x:p.x, ph0:R(0,1), s:R(5,11),
      rate: ratePerSec(R(36,96)/(oH+48), T),
      rot0:R(0,6.28), rateR: ratePerSec(R(0,1.8)*.1592, T) * (Math.random()<.5?-1:1)});
  }

  /* ③ 连线网络 */
  oNetBreath = ratePerSec(1000/9500/6.2832, T);   /* 整片网络的聚散呼吸，全局同频 */
  oNet=[];
  for(let i=0;i<56;i++){ const p=outsidePoint(22);
    oNet.push({hx:p.x, hy:p.y, x:p.x, y:p.y, lit:0,
      ph:R(0,6.28),
      rW1: ratePerSec(1000/2900/6.2832, T),      /* 摆动频率，圈/秒 */
      rW2: ratePerSec(1000/3300/6.2832, T),
      rPh: ratePerSec(1000/9500/6.2832, T),      /* 聚散呼吸 */
      fPh:R(0,6.28),
      rFlash: ratePerSec(1000/8300, T),          /* 节点点亮 */
      a:Math.atan2(p.y-oCY,p.x-oCX), r0:Math.hypot(p.x-oCX,p.y-oCY)}); }

  /* ④ 向心横流 */
  oInflow=[];
  for(let i=0;i<30;i++) oInflow.push({side:i%2?1:-1, ph0:R(0,1), y:R(.05,.95)*oH,
    rate: ratePerSec(R(.0016,.0042)*60, T)});

  /* ⑤ 顶部垂落 */
  oTop=[];
  for(let i=0;i<48;i++) oTop.push({x:R(0,oW), ph0:R(0,1),
    rate: ratePerSec(R(.004,.011)*60, T)});

  /* 两处节律：光柱脉动、光条下淌 —— 同样要能整除循环 */
  oPulseRate  = ratePerSec(1000/(6.2832*1900), T);
  oStreakRate = ratePerSec(1000/1400, T);
}
addEventListener('resize',layoutOuter);

/* 各主题的外围标记形状 */
function drawMotif(x,y,s,rot,alpha,col){
  og.save(); og.translate(x,y); og.rotate(rot); og.globalAlpha=alpha;
  og.strokeStyle=col; og.fillStyle=col;
  const kind=(CUR&&CUR.outer&&CUR.outer.motif)||'coin';
  if(kind==='coin'){
    og.lineWidth=Math.max(1.3,s*.34);
    og.beginPath(); og.arc(0,0,s,0,6.283); og.stroke();
    const q=s*.42; og.lineWidth=Math.max(1.1,s*.26); og.strokeRect(-q,-q,q*2,q*2);
  }else if(kind==='bolt'){
    og.lineWidth=Math.max(1.2,s*.3);
    og.beginPath();
    for(let i=0;i<6;i++){ const a=i/6*6.283; const px=Math.cos(a)*s, py=Math.sin(a)*s; i?og.lineTo(px,py):og.moveTo(px,py); }
    og.closePath(); og.stroke();
    og.beginPath(); og.arc(0,0,s*.34,0,6.283); og.stroke();
  }else if(kind==='star'){
    og.lineWidth=Math.max(1,s*.24);
    const q=s*.3;
    og.beginPath();
    og.moveTo(0,-s); og.quadraticCurveTo(q,-q,s,0); og.quadraticCurveTo(q,q,0,s);
    og.quadraticCurveTo(-q,q,-s,0); og.quadraticCurveTo(-q,-q,0,-s);
    og.closePath(); og.stroke();
    og.beginPath(); og.arc(0,0,s*.16,0,6.283); og.fill();
  }else if(kind==='leaf'){
    og.lineWidth=Math.max(1,s*.24);
    og.beginPath();
    og.moveTo(0,-s); og.quadraticCurveTo(s*.95,-s*.15,s*.15,s);
    og.quadraticCurveTo(-s*.65,s*.2,0,-s);
    og.closePath(); og.stroke();
    og.beginPath(); og.moveTo(0,-s*.85); og.lineTo(s*.1,s*.8); og.stroke();
  }else if(kind==='grain'){
    og.lineWidth=Math.max(1,s*.22);
    og.beginPath(); og.moveTo(0,-s); og.lineTo(0,s); og.stroke();
    for(let k=0;k<4;k++){
      const y=-s*.6+k*s*.4;
      og.beginPath(); og.moveTo(0,y); og.quadraticCurveTo(s*.6,y-s*.2,s*.52,y-s*.5); og.stroke();
      og.beginPath(); og.moveTo(0,y); og.quadraticCurveTo(-s*.6,y-s*.2,-s*.52,y-s*.5); og.stroke();
    }
  }else{
    og.lineWidth=Math.max(1,s*.22);
    og.beginPath(); og.arc(0,0,s,0,6.283); og.stroke();
    og.beginPath(); og.arc(-s*.3,-s*.3,s*.2,0,6.283); og.fill();
  }
  og.restore();
}

(function outerLoop(t){
  const tms = t || 0;
  if(!document.body.classList.contains('paused') && CUR){
    const C=CUR.palette, cfg=CUR.outer;
    const now=tms;
    const S=tms/1000;                     /* 秒 —— 所有运动都由它算出，不再逐帧累加 */
    og.clearRect(0,0,oW,oH);

    /* ① 外圈标记环 */
    const rx=oW*.26, ry=oH*.487;
    for(let i=0;i<oRing.length;i++){
      const c=oRing[i];
      const a=c.a0 + 6.2832*c.rateA*S;
      const rot=c.rot0 + 6.2832*c.rateR*S;
      const x=oCX+Math.cos(a)*rx, y=oCY+Math.sin(a)*ry;
      if(Math.hypot(x-oCX,y-oCY)<SAFE) continue;
      drawMotif(x,y,c.s,rot,.85,(i%3===0)?C.lineBright:C.line);
    }

    /* ② 双向流 */
    for(const c of oFall){
      const y=-24 + frac(c.ph0 + c.rate*S)*(oH+48);
      const rot=c.rot0 + 6.2832*c.rateR*S;
      drawMotif(c.x,y,c.s,rot,.62, c.s>8?C.lineBright:C.line);
    }
    for(const c of oRise){
      const y=oH+24 - frac(c.ph0 + c.rate*S)*(oH+48);
      if(Math.hypot(c.x-oCX,y-oCY)<SAFE) continue;
      const rot=c.rot0 + 6.2832*c.rateR*S;
      drawMotif(c.x,y,c.s,rot,.62, c.s>8?C.lineBright:C.line);
    }

    /* ③ 连线网络 */
    if(cfg.net){
      const phase=(1-Math.cos(6.2832*oNetBreath*S))/2;
      const LINK=Math.min(oW,oH)*(0.10+0.085*phase);
      for(const n of oNet){
        const push=1+0.10*phase;
        n.x=oCX+(n.hx-oCX)*push+Math.sin(6.2832*n.rW1*S+n.ph)*6;
        n.y=oCY+(n.hy-oCY)*push+Math.cos(6.2832*n.rW2*S+n.ph)*6;
        const fl=Math.sin(6.2832*n.rFlash*S+n.fPh);
        n.lit = fl>0 ? Math.pow(fl,6) : 0;
      }
      for(let i=0;i<oNet.length;i++){
        for(let j=i+1;j<oNet.length;j++){
          const a=oNet[i], b=oNet[j];
          const dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
          if(d2<LINK*LINK){
            const f=1-Math.sqrt(d2)/LINK, hot=Math.max(a.lit,b.lit);
            og.strokeStyle = hot>0
              ? 'rgba(255,240,184,'+(0.10+f*0.62*hot).toFixed(3)+')'
              : hexA(C.line,0.06+f*0.24);
            og.lineWidth = hot>0?1.6:1;
            og.beginPath(); og.moveTo(a.x,a.y); og.lineTo(b.x,b.y); og.stroke();
          }
        }
      }
      for(const n of oNet){
        const glow=n.lit>0?n.lit:0;
        og.beginPath();
        og.fillStyle = glow>0 ? 'rgba(255,240,184,'+(0.35+glow*0.6)+')' : hexA(C.line,.5);
        og.arc(n.x,n.y,1.6+glow*3.4,0,6.283); og.fill();
      }
    }

    /* ④ 向心横流 */
    if(cfg.inflow){
      for(const d of oInflow){
        const dp=frac(d.ph0 + d.rate*S);
        const x = d.side>0 ? dp*(oW/2) : oW-dp*(oW/2);
        if(Math.abs(x-oCX) < SAFE+18 || x < oW*0.38) continue;
        const fade=Math.sin(dp*Math.PI);
        og.strokeStyle=hexA(C.glow,0.12+fade*0.55);
        og.lineWidth=2;
        og.beginPath(); og.moveTo(x,d.y); og.lineTo(x-d.side*32,d.y); og.stroke();
        og.beginPath();
        og.fillStyle=hexA(C.lineBright,0.12+fade*0.6);
        og.arc(x,d.y,2.2,0,6.283); og.fill();
      }
    }

    /* ⑤ 顶部垂落 */
    if(cfg.pillar){
      for(const d of oTop){
        const dp=frac(d.ph0 + d.rate*S);
        const y=dp*oH*0.05;
        if(Math.hypot(d.x-oCX,y-oCY)<SAFE+6) continue;
        og.fillStyle=hexA(C.lineBright,(1-dp)*0.8);
        og.beginPath(); og.arc(d.x,y,1.8,0,6.283); og.fill();
      }
      const x=oW*0.925, len=oH*0.44;
      const pulse=0.5+0.5*Math.sin(6.2832*oPulseRate*S);
      og.strokeStyle=hexA(C.line,0.16+pulse*0.16);
      og.lineWidth=1.5;
      og.beginPath(); og.moveTo(x,0); og.lineTo(x,len); og.stroke();
      for(let i=0;i<7;i++){
        const p=frac(oStreakRate*S + i/7), y=p*len;
        og.strokeStyle=hexA(C.lineBright,(1-p)*0.85*pulse);
        og.lineWidth=2.6;
        og.beginPath(); og.moveTo(x,y); og.lineTo(x,y+22); og.stroke();
      }
      og.beginPath();
      og.fillStyle=hexA(C.lineBright,0.06+pulse*0.14);
      og.arc(x,len,3+pulse*5,0,6.283); og.fill();
    }

    /* ⑥ 主题自带逐帧动画 */
    if(CUR.tick) CUR.tick(now);
  }
  requestAnimationFrame(outerLoop);
})(0);

/* 十六进制色 → rgb 三元组 / rgba 字符串 */
function rgbPrefix(hex){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',';
}
function hexA(hex,a){ return rgbPrefix(hex)+a.toFixed(3)+')'; }

let pi=0;
function tint(h,amt){  /* 简易调色：整体提亮/压暗 */
  const n=parseInt(h.replace('#',''),16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*(1+amt)))));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='p'){
    pi=(pi+1)%3;
    if(pi===0){ applyPalette(CUR.palette); }
    else{
      const amt = pi===1 ? .22 : -.18;
      const p={}; for(const key in CUR.palette) p[key]=tint(CUR.palette[key],amt);
      p.cream=CUR.palette.cream; p.bg=tint(CUR.palette.bg, pi===1?-.15:.25);
      applyPalette(p);
      CUR._tmp=p;
    }
    buildSpec(Object.assign({},CUR,{palette:CUR._tmp||CUR.palette}));
  }
  if(k==='b') document.body.classList.toggle('paused');
  if(k==='h') document.body.classList.toggle('hide-ui');
  if(k==='i') $('#spec').classList.toggle('on');
  if(k>='1'&&k<='9'){
    const key=CATS[curCat].keys[parseInt(k,10)-1];

  }
  if(k==='[') jump(-1);
  if(k===']') jump(1);
});

/* ─────────── 主题选择器：分类 + 主题 ─────────── */
let curCat = 0;
function catOf(key){
  for(let i=0;i<CATS.length;i++) if(CATS[i].keys.indexOf(key)>=0) return i;
  return 0;
}
function buildBar(cat){
  curCat = Math.max(0, Math.min(CATS.length-1, cat));
  const cats = CATS.map((c,i)=>
    '<button data-c="'+i+'" class="'+(i===curCat?'on':'')+'">'+c.name+'</button>').join('');
  const items = CATS[curCat].keys.map((k,i)=>
    '<button data-t="'+k+'" class="'+(CUR&&CUR.id===k?'on':'')+'"><i>'+(i+1)+'</i>'+
    (THEMES[k]?THEMES[k].name:k)+'</button>').join('');
  $('#themes').innerHTML = '<div class="catrow">'+cats+'</div><div class="themerow">'+items+'</div>';
}
function jump(step){
  const i = ORDER.indexOf(CUR?CUR.id:ORDER[0]);
  const n = ORDER.length;
  pi=0; render(ORDER[((i+step)%n+n)%n]);
}

/* ─────────── 启动 ─────────── */
  (function boot(){
    $('#themes').addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.c!==undefined && b.dataset.c!==''){ buildBar(parseInt(b.dataset.c,10)); return; }
      if(b.dataset.t){ pi=0; render(b.dataset.t); }
    });
    window.__THEMES=THEMES;
    window.__TP={THEMES:THEMES, ORDER:ORDER, CATS:CATS, render:render,
                 motifSVG:motifSVG, cornerSVG:cornerSVG};
    buildBar(0);

    /* ?theme=xxx 可以直接指定初始主题，方便批量导出 */
    const tm=/[?&]theme=([a-z0-9_]+)/.exec(location.search||'');
    render((tm && THEMES[tm[1]]) ? tm[1] : 'mandala');

    /* 无缝循环模式：显示角标，并多吸附几次（动画可能陆续建立） */
    if(LOOP_T){
      const st=document.createElement('style');
      st.textContent='#loopbadge{position:fixed;left:2vh;bottom:2vh;z-index:10;'+
        'font-family:var(--mono);font-size:11px;letter-spacing:.16em;padding:6px 10px;'+
        'pointer-events:none;color:var(--bg);background:var(--line);opacity:.85}'+
        'body.hide-ui #loopbadge{display:none}';
      document.head.appendChild(st);
      const b=document.createElement('div');
      b.id='loopbadge';
      b.textContent='无缝循环 '+LOOP_T+'s';
      document.body.appendChild(b);
      document.title='时来运转 · 动效主题包（无缝循环 '+LOOP_T+'s）';
      setTimeout(applyLoopToAnimations, 600);
      setTimeout(applyLoopToAnimations, 1600);
    }
  })();
</script>
